<!doctype html>
<meta charset="utf-8">
<title>Pörssisähkö – vartit / 12h tuntikeskiarvo (legacy)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { background:#000; color:#fff; margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif; }
  header, footer { text-align:center; padding:12px; color:#ddd; }
  .container { max-width:1200px; margin:0 auto; }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid #111; transition:background .15s ease; }
  .row.now { font-size:64px; }
  .row.next { font-size:48px; color:#eee; }
  .time { letter-spacing:0.5px; }
  .price { font-variant-numeric: tabular-nums; }
  /* värikoodaus */
  .cheap .price { color:#8f8; }   /* < 5 c/kWh */
  .ok    .price { color:#fff; }   /* 5–10 */
  .high  .price { color:#fc6; }   /* 10–20 */
  .spike .price { color:#f77; }   /* ≥ 20 */
  /* korostus halvimmalle jaksolla */
  .highlight { background:#0f1a10; outline:2px solid #3fa73f; }
  .highlight .price { font-weight:700; }
  /* countdown */
  #countdown { font-weight:600; margin-left:8px; color:#9cf; }
  /* painikkeet */
  #toggle, .spanbtn {
    -webkit-appearance:none; appearance:none; border:1px solid #333; background:#111; color:#eee;
    padding:8px 14px; border-radius:10px; cursor:pointer; font-size:14px;
  }
  #toggle:hover, .spanbtn:hover { background:#151515; }
  #legend { font-size:12px; color:#aaa; }
  .group { display:flex; align-items:center; gap:8px; }
  .spanbtn[aria-pressed="true"] { background:#1e2a1e; border-color:#3fa73f; color:#cfe9cf; }
  .hidden { display:none !important; }
</style>

<header class="container">
  <div class="bar">
    <div>
      <div id="titleLine"></div>
      <div id="legend">Vaihda näkymää: vartit ↔ 12h tuntikeskiarvo • Lähde: sahkotin.fi (Nord Pool)</div>
    </div>

    <div class="group">
      <button id="toggle" aria-pressed="false" title="Vaihda näkymää">Näytä: 12 h tuntikeskihinta</button>
      <!-- 12h-näkymän korostusvalitsin -->
      <div id="spanChooser" class="group hidden" aria-label="Halvimman jakson pituus">
        <span style="font-size:12px;color:#aaa;">Korosta halvin jakso:</span>
        <button class="spanbtn" data-span="1" aria-pressed="true">1 h</button>
        <button class="spanbtn" data-span="2" aria-pressed="false">2 h</button>
        <button class="spanbtn" data-span="3" aria-pressed="false">3 h</button>
      </div>
    </div>
  </div>
</header>

<div id="list" class="container"></div>

<footer class="container" id="footerNote">Päivittyy minuutin välein • Virransäästö käytössä (tauko, kun välilehti ei ole näkyvissä)</footer>

<script>
/*** Asetukset ***/
var api = "https://sahkotin.fi/prices";

/*** Yleiset apurit (ILMAN Intl timeZonea) ***/
function pad2(n){ return (n<10 ? "0"+n : ""+n); }
function formatHHMMLocal(d){ return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
function formatDateLocal(d){ return pad2(d.getDate()) + "." + pad2(d.getMonth()+1) + "." + d.getFullYear(); }
function toIsoZ(d){
  // pyöristä ms → .000Z
  var z = new Date(Math.floor(d.getTime()/1000)*1000);
  return z.toISOString().replace(/\.\d{3}Z$/, ".000Z");
}
function floorToQuarterLocal(d){
  var r = new Date(d.getTime());
  r.setSeconds(0,0);
  r.setMinutes(Math.floor(r.getMinutes()/15)*15);
  return r;
}
function ceilToQuarterLocal(d){
  var f = floorToQuarterLocal(d);
  if (d.getSeconds()===0 && d.getMilliseconds()===0 && d.getMinutes()%15===0) return d;
  return new Date(f.getTime() + 15*60*1000);
}
function floorToHourLocal(d){
  var r = new Date(d.getTime());
  r.setMinutes(0,0,0);
  return r;
}
function priceClass(v){
  if (!isFinite(v)) return "";
  if (v < 5)  return "cheap";
  if (v < 10) return "ok";
  if (v < 20) return "high";
  return "spike";
}

/*** Tila ***/
var viewMode = "quarters";   // "quarters" | "hours"
var cheapestSpan = 1;        // 1 | 2 | 3
var loadInterval = null;
var countdownInterval = null;

/*** Countdown (paikallinen vartti) ***/
function updateCountdown(){
  var el = document.getElementById("countdown");
  if (!el) return;
  var now = new Date();
  var nq  = ceilToQuarterLocal(new Date(now.getTime()));
  var ms  = nq - now; if (ms<0) ms=0;
  var s   = Math.floor(ms/1000);
  el.textContent = "→ seuraava vartti " + pad2(Math.floor(s/60)) + ":" + pad2(s%60);
}

/*** VARTTINÄKYMÄ (nyt + 3) ***/
async function renderQuarters(){
  var now   = new Date();
  // haetaan -1h..+2h UTC:na: käytetään Date → ISO (UTC) – ok kaikissa selaimissa
  var start = new Date(now.getTime() - 60*60*1000);
  var end   = new Date(now.getTime() + 2*60*60*1000);
  start = floorToQuarterLocal(start);
  end   = ceilToQuarterLocal(end);
  var url   = api + "?quarter&fix&vat&start=" + toIsoZ(start) + "&end=" + toIsoZ(end);

  var res = await fetch(url, { cache: "no-store" });
  if (!res.ok) return;
  var data = await res.json();
  var prices = (data.prices||[]).map(function(p){
    return { ts: new Date(p.date), val: Number(p.value) };
  }).sort(function(a,b){ return a.ts - b.ts; });
  if (!prices.length) return;

  // Etsi nykyinen vartti (verrataan UTC-objekteja, ok)
  var quarterMs = 15*60*1000;
  var nowUtc = new Date();
  var idx = -1;
  for (var i=0;i<prices.length;i++){
    var s = prices[i].ts, e = new Date(s.getTime()+quarterMs);
    if (nowUtc >= s && nowUtc < e){ idx = i; break; }
  }
  if (idx < 0) idx = 0;

  var four = prices.slice(idx, idx+4);
  if (four.length < 4 && idx > 0){
    var need = 4 - four.length;
    four = prices.slice(Math.max(0, idx-need), idx).concat(four);
  }

  // otsikko
  var titleLine = document.getElementById("titleLine");
  titleLine.innerHTML = 'Tänään ' + formatDateLocal(now) +
                        ' | Nyt: ' + formatHHMMLocal(floorToQuarterLocal(now)) +
                        ' <span id="countdown"></span>';

  // rivit (näytetään paikallisena aikana)
  var list = document.getElementById("list");
  list.innerHTML = "";
  for (var k=0;k<four.length;k++){
    var p = four[k];
    var row = document.createElement("div");
    row.className = "row " + (k===0 ? "now" : "next") + " " + priceClass(p.val);
    var localTs = new Date(p.ts.getTime()); // Date-getters ovat lokaaleja
    row.innerHTML = '<div class="time">' + formatHHMMLocal(localTs) + '</div>' +
                    '<div class="price">' + p.val.toFixed(3) + ' c/kWh</div>';
    list.appendChild(row);
  }
}

/*** 12H TUNTIKESKIARVO + HALVIN JAKSO ***/
async function renderHourly12h(){
  // perusta: tämän kellotunnin alku laitteen paikallisaikana
  var base = floorToHourLocal(new Date());

  // luo 12h bucket-lista (label + key) paikallisen ajan perusteella
  var hours = [];
  for (var h=0; h<12; h++){
    var d = new Date(base.getTime() + h*60*60*1000);
    var key = d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours());
    hours.push({ key: key, label: pad2(d.getHours()) + ":00" });
  }

  // Hae vartit kattamaan ikkunan
  var windowStart = floorToQuarterLocal(new Date(base.getTime()));
  var windowEnd   = ceilToQuarterLocal(new Date(base.getTime() + 12*60*60*1000));
  var url         = api + "?quarter&fix&vat&start=" + toIsoZ(windowStart) + "&end=" + toIsoZ(windowEnd);

  var res = await fetch(url, { cache: "no-store" });
  if (!res.ok) return;
  var data = await res.json();
  var quarters = (data.prices||[]).map(function(p){
    return { ts: new Date(p.date), val: Number(p.value) };
  }).sort(function(a,b){ return a.ts - b.ts; });
  if (!quarters.length) return;

  // Aggretoi tuntiavaimella paikallisesti
  var agg = {}; // key -> {sum, count}
  for (var q=0; q<quarters.length; q++){
    var ts = new Date(quarters[q].ts.getTime()); // Date-getters paikallisia
    var key = ts.getFullYear() + "-" + pad2(ts.getMonth()+1) + "-" + pad2(ts.getDate()) + "T" + pad2(ts.getHours());
    if (!agg[key]) agg[key] = { sum:0, count:0 };
    agg[key].sum += quarters[q].val;
    agg[key].count += 1;
  }

  // Muodosta bucketit järjestyksessä
  var buckets = [];
  for (var i=0;i<hours.length;i++){
    var k = hours[i].key;
    var a = agg[k];
    var avg = (a && a.count) ? (a.sum / a.count) : NaN;
    buckets.push({ key:k, label:hours[i].label, avg:avg });
  }

  // Halvin peräkkäinen jakso pituudella cheapestSpan
  var K = Math.max(1, Math.min(3, cheapestSpan));
  var bestStart = -1, bestSum = Infinity;
  for (var s=0; s+K-1<buckets.length; s++){
    var sum = 0, ok = true;
    for (var j=0;j<K;j++){
      var v = buckets[s+j].avg;
      if (!isFinite(v)){ ok=false; break; }
      sum += v;
    }
    if (ok && sum < bestSum){ bestSum = sum; bestStart = s; }
  }

  // otsikko
  var titleLine = document.getElementById("titleLine");
  titleLine.textContent = 'Seuraavat 12 tuntia – kellotunnin keskihinta (alkaen ' + formatHHMMLocal(base) + ')';

  // rivit
  var list = document.getElementById("list");
  list.innerHTML = "";
  for (var r=0; r<buckets.length; r++){
    var b = buckets[r];
    var withinBest = (bestStart >= 0 && r >= bestStart && r < bestStart + K);
    var row = document.createElement("div");
    row.className = "row next " + priceClass(b.avg) + (withinBest ? " highlight" : "");
    row.innerHTML = '<div class="time">' + b.label + '</div>' +
                    '<div class="price">' + (isFinite(b.avg) ? b.avg.toFixed(3) : '-') + ' c/kWh</div>';
    list.appendChild(row);
  }
}

/*** Näkymän vaihto + ajastus/virransäästö ***/
async function render(){
  var chooser = document.getElementById("spanChooser");
  if (viewMode === "quarters"){
    chooser.classList.add("hidden");
    await renderQuarters();
    updateCountdown();
  } else {
    chooser.classList.remove("hidden");
    await renderHourly12h();
  }
}
function applyToggleButton(){
  var btn = document.getElementById("toggle");
  if (viewMode === "quarters"){
    btn.textContent = "Näytä: 12 h tuntikeskihinta";
    btn.setAttribute("aria-pressed", "false");
  } else {
    btn.textContent = "Näytä: nyt + 3 varttia";
    btn.setAttribute("aria-pressed", "true");
  }
}
function startIntervals(){
  stopIntervals();
  loadInterval = setInterval(render, 60*1000);
  if (viewMode === "quarters"){
    countdownInterval = setInterval(updateCountdown, 250);
  }
}
function stopIntervals(){
  if (loadInterval){ clearInterval(loadInterval); loadInterval = null; }
  if (countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
}
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "visible"){
    render();
    startIntervals();
  } else {
    stopIntervals();
  }
});

/*** Käynnistys ***/
document.addEventListener("DOMContentLoaded", function(){
  render();
  startIntervals();

  // Toggle
  var btn = document.getElementById("toggle");
  applyToggleButton();
  btn.addEventListener("click", async function(){
    viewMode = (viewMode === "quarters") ? "hours" : "quarters";
    applyToggleButton();
    await render();
    startIntervals();
  });

  // Halvimmat tunnit -valitsin
  var spanBtns = document.querySelectorAll('.spanbtn');
  for (var i=0;i<spanBtns.length;i++){
    spanBtns[i].addEventListener('click', async function(e){
      var span = Number(e.currentTarget.getAttribute('data-span')) || 1;
      cheapestSpan = Math.max(1, Math.min(3, span));
      // päivitä napit
      for (var j=0;j<spanBtns.length;j++){
        var on = Number(spanBtns[j].getAttribute('data-span')) === cheapestSpan;
        spanBtns[j].setAttribute('aria-pressed', on ? 'true' : 'false');
      }
      if (viewMode === "hours") await renderHourly12h();
    });
  }
});
</script>
