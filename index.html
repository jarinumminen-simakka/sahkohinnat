<!doctype html>
<meta charset="utf-8">
<title>Pörssisähkö – vartit / 12h tuntikeskiarvo</title>
<style>
  html, body { background:#000; color:#fff; margin:0;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell; }
  header, footer { text-align:center; padding:12px; color:#ddd; }
  .container { max-width:1200px; margin:0 auto; }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .row { display:flex; justify-content:space-between; align-items:center;
         padding:16px 24px; border-bottom:1px solid #111; transition:background .15s ease; }
  .row.now { font-size:64px; }
  .row.next { font-size:48px; color:#eee; }
  .time { letter-spacing:0.5px; }
  .price { font-variant-numeric: tabular-nums; }
  /* Värikoodaus hinnan mukaan */
  .cheap .price { color:#8f8; }   /* < 5 c/kWh */
  .ok    .price { color:#fff; }   /* 5–10 */
  .high  .price { color:#fc6; }   /* 10–20 */
  .spike .price { color:#f77; }   /* ≥ 20 */
  /* Korostus halvimmalle jaksolla */
  .highlight { background:#0f1a10; outline:2px solid #3fa73f; }
  .highlight .price { font-weight:700; }
  /* Countdown */
  #countdown { font-weight:600; margin-left:8px; color:#9cf; }
  /* Painikkeet */
  #toggle, .spanbtn {
    appearance:none; border:1px solid #333; background:#111; color:#eee;
    padding:8px 14px; border-radius:10px; cursor:pointer; font-size:14px;
  }
  #toggle:hover, .spanbtn:hover { background:#151515; }
  #legend { font-size:12px; color:#aaa; }
  .group { display:flex; align-items:center; gap:8px; }
  .spanbtn[aria-pressed="true"] { background:#1e2a1e; border-color:#3fa73f; color:#cfe9cf; }
  .hidden { display:none !important; }
</style>

<header class="container">
  <div class="bar">
    <div>
      <div id="titleLine"></div>
      <div id="legend">Vaihda näkymää: vartit ↔ 12h tuntikeskiarvo • Lähde: sahkotin.fi (Nord Pool)</div>
    </div>

    <div class="group">
      <button id="toggle" aria-pressed="false" title="Vaihda näkymää">Näytä: 12 h tuntikeskihinta</button>
      <!-- 12h-näkymän korostusvalitsin -->
      <div id="spanChooser" class="group hidden" aria-label="Halvimman jakson pituus">
        <span style="font-size:12px;color:#aaa;">Korosta halvin jakso:</span>
        <button class="spanbtn" data-span="1" aria-pressed="true">1 h</button>
        <button class="spanbtn" data-span="2" aria-pressed="false">2 h</button>
        <button class="spanbtn" data-span="3" aria-pressed="false">3 h</button>
      </div>
    </div>
  </div>
</header>

<div id="list" class="container"></div>

<footer class="container" id="footerNote">Päivittyy minuutin välein • Virransäästö käytössä (tauko, kun välilehti ei ole näkyvissä)</footer>

<script>
/*** Asetukset ***/
const tz  = "Europe/Helsinki";
const api = "https://sahkotin.fi/prices";

/*** Aika-apurit ***/
function toIsoZ(d){
  const z = new Date(Math.floor(d.getTime()/1000)*1000);
  return z.toISOString().replace(/\.\d{3}Z$/, ".000Z");
}
function floorToQuarter(d){
  const r = new Date(d); r.setSeconds(0,0);
  r.setMinutes(Math.floor(r.getMinutes()/15)*15);
  return r;
}
function ceilToQuarter(d){
  const f = floorToQuarter(d);
  if (d.getSeconds()===0 && d.getMilliseconds()===0 && d.getMinutes()%15===0) return d;
  return new Date(f.getTime() + 15*60*1000);
}

/* Formatterit */
const fmtHHMM = new Intl.DateTimeFormat('fi-FI', { timeZone: tz, hour:'2-digit', minute:'2-digit', hour12:false });
const fmtDate = new Intl.DateTimeFormat('fi-FI', { timeZone: tz, day:'2-digit', month:'2-digit', year:'numeric' });
const fmtPartsHour = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hour12:false });
function formatHHMM(date){ return fmtHHMM.format(date); }
function formatDate(date){ return fmtDate.format(date); }
function hourKey(date){ // YYYY-MM-DDTHH (Helsinki)
  const parts = fmtPartsHour.formatToParts(date);
  let y="", m="", d="", h="";
  for (const p of parts){
    if (p.type==='year')  y=p.value;
    else if (p.type==='month') m=p.value;
    else if (p.type==='day')   d=p.value;
    else if (p.type==='hour')  h=p.value;
  }
  return `${y}-${m}-${d}T${h}`;
}
function hourLabelFromKey(key){ return (key.split('T')[1] || "--") + ':00'; }

/*** Väriluokka hinnalle ***/
function priceClass(v){
  if (!Number.isFinite(v)) return "";
  if (v < 5)  return "cheap";
  if (v < 10) return "ok";
  if (v < 20) return "high";
  return "spike";
}

/*** Tila ***/
let viewMode = "quarters";       // "quarters" | "hours"
let cheapestSpan = 1;            // 1 | 2 | 3 (12h-näkymän halvin peräkkäinen jakso)
let loadInterval = null;
let countdownInterval = null;

/*** Countdown seuraavaan varttiin ***/
function updateCountdown(){
  const el = document.getElementById("countdown");
  if (!el) return;
  const now = new Date();
  const nq  = ceilToQuarter(new Date(now));
  let ms    = nq - now; if (ms<0) ms=0;
  const s   = Math.floor(ms/1000);
  el.textContent = "→ seuraava vartti " +
    String(Math.floor(s/60)).padStart(2,'0') + ":" +
    String(s%60).padStart(2,'0');
}

/*** Hae ja näytä: vartit (nyt + 3) ***/
async function renderQuarters(){
  const now   = new Date();
  const start = floorToQuarter(new Date(now.getTime() - 60*60*1000)); // -1h
  const end   = ceilToQuarter(new Date(now.getTime() + 2*60*60*1000)); // +2h
  const url   = api + "?quarter&fix&vat&start=" + toIsoZ(start) + "&end=" + toIsoZ(end);

  const res   = await fetch(url, { cache: "no-store" });
  if (!res.ok) return;
  const data   = await res.json();
  const prices = (data.prices||[])
    .map(p=>({ ts:new Date(p.date), val:Number(p.value) }))
    .sort((a,b)=>a.ts-b.ts);
  if (prices.length === 0) return;

  const quarterMs = 15*60*1000;
  const nowUtc    = new Date();
  let idx = prices.findIndex(p => nowUtc >= p.ts && nowUtc < new Date(p.ts.getTime()+quarterMs));
  if (idx < 0) idx = 0;

  let four = prices.slice(idx, idx+4);
  if (four.length < 4 && idx > 0) {
    const need = 4 - four.length;
    four = prices.slice(Math.max(0, idx-need), idx).concat(four);
  }

  const titleLine = document.getElementById("titleLine");
  titleLine.innerHTML = 'Tänään ' + formatDate(now) +
                        ' | Nyt: ' + formatHHMM(floorToQuarter(now)) +
                        ' <span id="countdown"></span>';

  const list = document.getElementById("list");
  list.innerHTML = "";
  four.forEach((p,i)=>{
    const row = document.createElement("div");
    row.className = "row " + (i===0 ? "now" : "next") + " " + priceClass(p.val);
    row.innerHTML =
      '<div class="time">' + formatHHMM(p.ts) + '</div>' +
      '<div class="price">' + p.val.toFixed(3) + ' c/kWh</div>';
    list.appendChild(row);
  });
}

/*** Hae ja näytä: 12 tunnin tuntikeskiarvot + halvin peräkkäinen jakso ***/
async function renderHourly12h(){
  const base = new Date(); base.setMinutes(0,0,0); // tämän kellotunnin alku
  // tee 12 tunnin "bucketlist" (avaimet + labelit Helsinki-ajassa)
  const hours = Array.from({length:12}, (_,h)=>{
    const d = new Date(base.getTime() + h*60*60*1000);
    const key = hourKey(d);
    return { key, label: hourLabelFromKey(key) };
  });

  // Hae ikkunan vartit
  const windowStart = floorToQuarter(new Date(base));
  const windowEnd   = ceilToQuarter(new Date(base.getTime() + 12*60*60*1000));
  const url         = api + "?quarter&fix&vat&start=" + toIsoZ(windowStart) + "&end=" + toIsoZ(windowEnd);

  const res   = await fetch(url, { cache: "no-store" });
  if (!res.ok) return;
  const data     = await res.json();
  const quarters = (data.prices||[])
    .map(p=>({ ts:new Date(p.date), val:Number(p.value) }))
    .sort((a,b)=>a.ts-b.ts);
  if (quarters.length === 0) return;

  // Aggretoi tuntiavaimella (Helsinki-aika)
  const agg = new Map(); // key -> {sum, count}
  for (const q of quarters){
    const k = hourKey(q.ts);
    if (!k) continue;
    const a = agg.get(k) || { sum:0, count:0 };
    a.sum += q.val; a.count += 1;
    agg.set(k, a);
  }

  // Rakenna bucketit järjestyksessä
  const buckets = hours.map(h=>{
    const a = agg.get(h.key);
    const avg = (a && a.count) ? (a.sum / a.count) : NaN;
    return { key:h.key, label:h.label, avg };
  });

  // Laske halvin peräkkäinen jakso pituudella cheapestSpan (1–3)
  let bestStart = -1, bestSum = Infinity;
  const K = Math.max(1, Math.min(3, cheapestSpan));
  for (let i=0; i+K-1 < buckets.length; i++){
    let sum = 0, ok = true;
    for (let j=0; j<K; j++){
      const v = buckets[i+j].avg;
      if (!Number.isFinite(v)){ ok = false; break; }
      sum += v;
    }
    if (ok && sum < bestSum){ bestSum = sum; bestStart = i; }
  }

  const titleLine = document.getElementById("titleLine");
  titleLine.textContent = 'Seuraavat 12 tuntia – kellotunnin keskihinta (alkaen ' + formatHHMM(base) + ')';

  const list = document.getElementById("list");
  list.innerHTML = "";
  buckets.forEach((b, idx)=>{
    const row = document.createElement("div");
    const withinBest = (bestStart >= 0 && idx >= bestStart && idx < bestStart + K);
    row.className = "row next " + priceClass(b.avg) + (withinBest ? " highlight" : "");
    row.innerHTML =
      '<div class="time">' + b.label + '</div>' +
      '<div class="price">' + (Number.isFinite(b.avg) ? b.avg.toFixed(3) : '-') + ' c/kWh</div>';
    list.appendChild(row);
  });
}

/*** Näkymän vaihto ***/
async function render(){
  const chooser = document.getElementById("spanChooser");
  if (viewMode === "quarters"){
    chooser.classList.add("hidden");      // piilota span-valitsin
    await renderQuarters();
    updateCountdown();
  } else {
    chooser.classList.remove("hidden");   // näytä span-valitsin
    await renderHourly12h();
  }
}
function applyToggleButton(){
  const btn = document.getElementById("toggle");
  if (viewMode === "quarters"){
    btn.textContent = "Näytä: 12 h tuntikeskihinta";
    btn.setAttribute("aria-pressed", "false");
  } else {
    btn.textContent = "Näytä: nyt + 3 varttia";
    btn.setAttribute("aria-pressed", "true");
  }
}

/*** Ajastimet & virransäästö ***/
function startIntervals(){
  stopIntervals();
  loadInterval = setInterval(render, 60*1000); // data päivittyy minuutin välein
  if (viewMode === "quarters"){
    countdownInterval = setInterval(updateCountdown, 250);
  }
}
function stopIntervals(){
  if (loadInterval){ clearInterval(loadInterval); loadInterval = null; }
  if (countdownInterval){ clearInterval(countdownInterval); countdownInterval = null; }
}
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState === "visible"){
    render();         // päivitä heti kun näkyviin
    startIntervals(); // ajastimet päälle
  } else {
    stopIntervals();  // virransäästö
  }
});

/*** Käynnistys ***/
document.addEventListener("DOMContentLoaded", ()=>{
  render();
  startIntervals();

  // Toggle-näkymä
  const btn = document.getElementById("toggle");
  applyToggleButton();
  btn.addEventListener("click", async ()=>{
    viewMode = (viewMode === "quarters") ? "hours" : "quarters";
    applyToggleButton();
    await render();
    startIntervals();
  });

  // Halvimmat tunnit -valitsin
  document.querySelectorAll('.spanbtn').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      const span = Number(e.currentTarget.getAttribute('data-span')) || 1;
      cheapestSpan = Math.max(1, Math.min(3, span));
      // päivitä napit
      document.querySelectorAll('.spanbtn').forEach(x=>{
        const on = Number(x.getAttribute('data-span')) === cheapestSpan;
        x.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      // jos ollaan 12h-näkymässä, renderöi heti
      if (viewMode === "hours") await renderHourly12h();
    });
  });
});
</script>
